name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.1.0)'
        required: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}

    steps:
      - name: Validate release tag
        id: release
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ env.RELEASE_TAG }}"

          if [[ ! "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag: ${TAG}"
            echo "Expected format: vMAJOR.MINOR.PATCH"
            exit 1
          fi

          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

  create-release:
    needs: prepare
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false

      - name: Generate release notes
        run: node scripts/generate-release-notes.mjs ${{ needs.prepare.outputs.tag }} > RELEASE_NOTES.md

      - name: Create draft release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: ${{ needs.prepare.outputs.tag }}
          draft: true
          make_latest: false
          body_path: RELEASE_NOTES.md

  build:
    needs:
      - prepare
      - create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            target: aarch64-apple-darwin
            name: macOS-ARM64
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            name: Windows-x64
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            name: Windows-ARM64

    runs-on: ${{ matrix.runner }}
    name: Build (${{ matrix.name }})

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false

      - name: Enable pnpm via Corepack
        run: |
          corepack enable
          corepack prepare pnpm@11.26.0 --activate

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync workspace version to release tag
        run: node scripts/sync-release-version.mjs ${{ needs.prepare.outputs.version }}

      - name: Ensure updater signing key is configured
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [[ -z "${TAURI_SIGNING_PRIVATE_KEY}" ]]; then
            echo "TAURI_SIGNING_PRIVATE_KEY is not configured."
            exit 1
          fi

      - name: Build, sign, and upload Tauri app
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ needs.prepare.outputs.tag }}
          releaseName: ${{ needs.prepare.outputs.tag }}
          releaseDraft: true
          uploadUpdaterJson: false
          uploadUpdaterSignatures: true
          updaterJsonPreferNsis: true
          args: --target ${{ matrix.target }}

  release:
    needs:
      - prepare
      - build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false

      - name: Generate release notes
        run: node scripts/generate-release-notes.mjs ${{ needs.prepare.outputs.tag }} > updater-release-notes.md

      - name: Download signed updater artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p updater-release
          gh release download "${{ needs.prepare.outputs.tag }}" --pattern '*.sig' --dir updater-release
          gh release download "${{ needs.prepare.outputs.tag }}" --pattern '*_aarch64.app.tar.gz' --dir updater-release
          gh release download "${{ needs.prepare.outputs.tag }}" --pattern '*_x64-setup.exe' --dir updater-release
          gh release download "${{ needs.prepare.outputs.tag }}" --pattern '*_arm64-setup.exe' --dir updater-release
          gh release view "${{ needs.prepare.outputs.tag }}" --json assets > updater-release/assets-before-metadata.json

      - name: Generate and upload updater metadata
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/generate-updater-release.mjs \
            updater-release \
            "${{ needs.prepare.outputs.version }}" \
            updater-release-notes.md \
            updater-release/assets-before-metadata.json \
            src-tauri/tauri.conf.json
          gh release upload "${{ needs.prepare.outputs.tag }}" updater-release/latest.json --clobber
          gh release view "${{ needs.prepare.outputs.tag }}" --json assets > updater-release/assets.json

      - name: Verify updater signatures with embedded public key
        run: |
          sudo apt-get update
          sudo apt-get install --yes minisign
          while IFS= read -r asset; do
            signature="updater-release/${asset}.sig"
            node -e "require('node:fs').writeFileSync(process.argv[2], Buffer.from(require('node:fs').readFileSync(process.argv[1], 'utf8').trim(), 'base64'))" \
              "${signature}" "${signature}.minisig"
            minisign -Vm "updater-release/${asset}" \
              -p updater-release/updater.pub \
              -x "${signature}.minisig"
          done < updater-release/selected-updater-assets.txt

      - name: Validate updater metadata
        run: node scripts/validate-updater-release.mjs updater-release/latest.json ${{ needs.prepare.outputs.version }} updater-release/assets.json

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ needs.prepare.outputs.tag }}" --draft=false --latest

  homebrew-tap:
    name: Update Homebrew Tap
    needs:
      - prepare
      - release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}

    steps:
      - name: Ensure Homebrew tap token is configured
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${HOMEBREW_TAP_TOKEN}" ]]; then
            echo "HOMEBREW_TAP_TOKEN is not configured."
            exit 1
          fi

      - name: Checkout TransNovel release
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          path: transnovel

      - name: Checkout homebrew-tap
        uses: actions/checkout@v7
        with:
          repository: azyu/homebrew-tap
          token: ${{ env.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false

      - name: Load published release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --json assets > homebrew-release.json

      - name: Render cask from published DMG digest
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          node transnovel/scripts/render-homebrew-cask.mjs \
            "${RELEASE_TAG}" \
            homebrew-release.json \
            homebrew-tap/Casks/transnovel.rb.template \
            homebrew-tap/Casks/transnovel.rb

      - name: Commit and push cask update
        shell: bash
        working-directory: homebrew-tap
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail

          if git diff --quiet -- Casks/transnovel.rb; then
            echo "Homebrew cask already matches ${RELEASE_TAG}."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/transnovel.rb
          git commit -m "chore: update transnovel to ${RELEASE_TAG#v}"
          git push origin HEAD:main

  sync-main-version:
    needs:
      - prepare
      - release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false

      - name: Sync workspace version to release tag
        run: node scripts/sync-release-version.mjs ${{ needs.prepare.outputs.version }}

      - name: Commit and push synced version
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet -- package.json src-tauri/Cargo.toml src-tauri/Cargo.lock src-tauri/tauri.conf.json; then
            echo "Workspace version already matches release tag."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json src-tauri/Cargo.toml src-tauri/Cargo.lock src-tauri/tauri.conf.json
          git commit -m "chore(release): sync app version to ${{ needs.prepare.outputs.tag }}"
          git push origin HEAD:main
