[package]
name = "transnovel"
version = "0.1.7"
description = "AI-powered Japanese web novel translator"
authors = ["TransNovel Team"]
license = "MIT"
repository = "https://github.com/azyu/transnovel"
edition = "2021"
rust-version = "1.90"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "TransNovel"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.5.3", features = [] }

[dependencies]
# Tauri core
tauri = { version = "2.9.5", features = [] }
tauri-plugin-log = "2"
tauri-plugin-http = "2"
tauri-plugin-dialog = "2"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"

# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP client
# native-tls keeps the OS TLS stack (SecureTransport/SChannel) used before 0.13 and avoids
# reqwest 0.13's default rustls+aws-lc-rs, which needs CMake/NASM on windows-11-arm.
# native-tls-no-alpn without http2 keeps HTTP/1.1, as 0.12's default-tls (no ALPN) did.
# rustls-no-provider is already enabled by tauri-plugin-updater; it is listed because
# services/updater.rs calls tls_backend_rustls() to keep the updater on rustls + ring.
reqwest = { version = "0.13", default-features = false, features = ["native-tls-no-alpn", "rustls-no-provider", "charset", "system-proxy", "json", "stream", "form"] }

# HTML parsing
scraper = "0.29"
regex = "1.11"

# Logging
log = "0.4"

# Utilities
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4"] }
dirs = "7"
sha2 = "0.11"
hex = "0.4"
base64 = "0.23"
rand = "0.10"
futures = "0.3"
async-trait = "0.1"
open = "5"

zip = { version = "9", default-features = false, features = ["deflate"] }
# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
# Minor-pinned: services/updater.rs uses configure_client, whose reqwest may change in minor releases.
tauri-plugin-updater = "~2.14"

[dev-dependencies]
# Same provider tauri-plugin-updater installs before building its client.
rustls = { version = "0.23", default-features = false, features = ["ring"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
